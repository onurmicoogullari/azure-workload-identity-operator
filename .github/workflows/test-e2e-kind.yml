name: Kind E2E Tests

on:
  push:
  pull_request:

permissions: {}

env:
  KIND_VERSION: v0.32.0

jobs:
  test-e2e-kind:
    permissions:
      contents: read
    name: Kind E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install pinned Kind
        run: |
          kind_asset="kind-linux-$(go env GOARCH)"
          curl -fsSLO "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/${kind_asset}"
          curl -fsSLO "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/${kind_asset}.sha256sum"
          sha256sum --check "${kind_asset}.sha256sum"
          sudo install "$kind_asset" /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Run Kind E2E tests
        run: |
          go mod tidy
          make test-e2e-kind
