apiVersion: workloadidentity.azure.micosolutions.se/v1alpha1
kind: OIDCIssuer
metadata:
  name: default
spec:
  azure:
    storageAccountName: ${AZURE_STORAGE_ACCOUNT_NAME}
    blobContainerName: ${AZURE_BLOB_CONTAINER_NAME}
  signingKey:
    secretRef:
      namespace: ${SIGNING_KEY_SECRET_NAMESPACE}
      name: ${SIGNING_KEY_SECRET_NAME}
      key: ${SIGNING_KEY_SECRET_KEY}
  openShift:
    updateServiceAccountIssuer: ${OPENSHIFT_UPDATE_SERVICE_ACCOUNT_ISSUER}
  deletionPolicy: ${OIDC_ISSUER_DELETION_POLICY}
