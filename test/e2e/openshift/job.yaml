apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: ${SERVICE_ACCOUNT_NAME}
      containers:
        - name: ${JOB_NAME}
          image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/${IMAGE_NAME}:latest
          imagePullPolicy: Always
          env:
            - name: KEY_VAULT_NAME
              value: ${KEY_VAULT_NAME}
            - name: KEY_VAULT_SECRET_NAME
              value: ${KEY_VAULT_SECRET_NAME}
            - name: KEY_VAULT_READ_TIMEOUT_SECONDS
              value: "${KEY_VAULT_READ_TIMEOUT_SECONDS}"
