apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-wi-webhook-admin
  namespace: {{ include "workload-identity-webhook.namespace" . }}
  labels:
    app: {{ include "workload-identity-webhook.name" . | quote }}
    azure-workload-identity.io/system: "true"
    chart: {{ include "workload-identity-webhook.name" . | quote }}
    release: {{ .Release.Name | quote }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
