apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
{{- $certificates := .Values.global.webhookCertificates }}
{{- $userAnnotations := omit .Values.mutatingWebhookAnnotations "cert-manager.io/inject-ca-from" "service.beta.openshift.io/inject-cabundle" }}
metadata:
  name: azure-wi-webhook-mutating-webhook-configuration
  {{- if or (eq $certificates.provider "certManager") (eq $certificates.provider "openShiftServiceCA") $userAnnotations }}
  annotations:
    {{ if eq $certificates.provider "certManager" -}}
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" (include "workload-identity-webhook.namespace" .) "azure-wi-webhook-serving-cert" | quote }}
    {{- else if eq $certificates.provider "openShiftServiceCA" }}
    service.beta.openshift.io/inject-cabundle: "true"
    {{- end }}
    {{- with $userAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    app: {{ include "workload-identity-webhook.name" . | quote }}
    azure-workload-identity.io/system: "true"
    chart: {{ include "workload-identity-webhook.name" . | quote }}
    release: {{ .Release.Name | quote }}
webhooks:
  - name: mutation.azure-workload-identity.io
    admissionReviewVersions:
      - v1
      - v1beta1
    clientConfig:
      {{- if eq $certificates.provider "selfManaged" }}
      caBundle: {{ required "global.webhookCertificates.selfManaged.azureWorkloadIdentity.caBundle is required for selfManaged" $certificates.selfManaged.azureWorkloadIdentity.caBundle | b64enc }}
      {{- end }}
      service:
        name: azure-wi-webhook-webhook-service
        namespace: {{ include "workload-identity-webhook.namespace" . }}
        path: /mutate-v1-pod
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector:
      {{- toYaml .Values.mutatingWebhookNamespaceSelector | nindent 6 }}
    objectSelector:
      matchLabels:
        azure.workload.identity/use: "true"
    reinvocationPolicy: IfNeeded
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    sideEffects: None
