apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "azure-workload-identity-operator.resourceName" (dict "suffix" "service-account-token-issuer" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-workload-identity-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - {{ include "azure-workload-identity-operator.serviceAccountName" . }}
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "azure-workload-identity-operator.labels" . | nindent 4 }}
  name: {{ include "azure-workload-identity-operator.resourceName" (dict "suffix" "service-account-token-issuer" "context" $) }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "azure-workload-identity-operator.resourceName" (dict "suffix" "service-account-token-issuer" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "azure-workload-identity-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
