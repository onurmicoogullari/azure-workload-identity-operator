apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "azure-workload-identity-operator.labels" . | nindent 4 }}
  name: {{ include "azure-workload-identity-operator.resourceName" (dict "suffix" "manager-rolebinding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "azure-workload-identity-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "azure-workload-identity-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
