{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "azure-workload-identity-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "azure-workload-identity-operator.resourceName" (dict "suffix" "workloadidentityrecovery-editor-role" "context" $) }}
rules:
- apiGroups:
  - workloadidentity.azure.micosolutions.se
  resources:
  - workloadidentityrecoveries
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workloadidentity.azure.micosolutions.se
  resources:
  - workloadidentityrecoveries/status
  verbs:
  - get
{{- end }}
