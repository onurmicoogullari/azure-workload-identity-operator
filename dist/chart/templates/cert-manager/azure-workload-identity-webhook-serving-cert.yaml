{{- if .Values.azureWorkloadIdentityWebhook.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: azure-wi-webhook-selfsigned-issuer
  namespace: {{ .Values.azureWorkloadIdentityWebhook.namespaceOverride }}
  labels:
    {{- include "azure-workload-identity-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: workload-identity-webhook
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.azureWorkloadIdentityWebhook.certManagerCertificateName }}
  namespace: {{ .Values.azureWorkloadIdentityWebhook.namespaceOverride }}
  labels:
    {{- include "azure-workload-identity-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: workload-identity-webhook
spec:
  dnsNames:
    - azure-wi-webhook-webhook-service.{{ .Values.azureWorkloadIdentityWebhook.namespaceOverride }}.svc
    - azure-wi-webhook-webhook-service.{{ .Values.azureWorkloadIdentityWebhook.namespaceOverride }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: azure-wi-webhook-selfsigned-issuer
  privateKey:
    rotationPolicy: Always
  secretName: azure-wi-webhook-server-cert
{{- end }}
