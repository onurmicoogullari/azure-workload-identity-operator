apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-workload-identity-operator-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-workload-identity-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.manager.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azure-workload-identity-operator
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.manager.podAnnotations }}
        {{- with omit . "kubectl.kubernetes.io/default-container" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      labels:
        {{- include "azure-workload-identity-operator.labels" . | nindent 8 }}
        control-plane: controller-manager
        {{- with .Values.manager.podLabels }}
        {{- with omit . "app.kubernetes.io/instance" "app.kubernetes.io/managed-by" "app.kubernetes.io/name" "app.kubernetes.io/version" "control-plane" "helm.sh/chart" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "azure-workload-identity-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            {{- if not .Values.metrics.secure }}
            - --metrics-secure=false
            {{- end }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            - --oidc-issuer-refresh-interval={{ .Values.manager.refreshIntervals.oidcIssuer }}
            - --workload-identity-refresh-interval={{ .Values.manager.refreshIntervals.workloadIdentity }}
            - --azure-subscription-id={{ required "azure.subscriptionId is required" .Values.azure.subscriptionId }}
            - --azure-resource-group-name={{ required "azure.resourceGroupName is required" .Values.azure.resourceGroupName }}
            - --azure-location={{ required "azure.location is required" .Values.azure.location }}
          image: {{ if .Values.manager.image.digest }}{{ printf "%s@%s" .Values.manager.image.repository .Values.manager.image.digest | quote }}{{ else if contains "@" .Values.manager.image.repository }}{{ .Values.manager.image.repository | quote }}{{ else }}{{ printf "%s:%s" .Values.manager.image.repository (.Values.manager.image.tag | default .Chart.AppVersion) | quote }}{{ end }}
          imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
          env:
            - name: AZURE_TOKEN_CREDENTIALS
              value: prod
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            {{- with .Values.azure.credentials.existingSecret }}
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: AZURE_CLIENT_ID
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: AZURE_TENANT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: AZURE_CLIENT_SECRET
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: webhook-server
              containerPort: 9443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.manager.securityContext | nindent 12 }}
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: {{ include "azure-workload-identity-operator.webhookSecretName" . }}
