apiVersion: workloadidentity.azure.micosolutions.se/v1alpha1
kind: WorkloadIdentity
metadata:
  labels:
    app.kubernetes.io/name: azure-workload-identity-operator
    app.kubernetes.io/managed-by: kustomize
  name: workloadidentity-sample
spec:
  azure:
    userAssignedIdentityName: uami-azwi-sample
    federatedIdentityCredentialName: fic-azwi-sample
  serviceAccount:
    name: azwi-sample
  deletionPolicy: Retain
