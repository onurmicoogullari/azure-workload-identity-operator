apiVersion: workloadidentity.azure.micosolutions.se/v1alpha1
kind: WorkloadIdentityRecovery
metadata:
  labels:
    app.kubernetes.io/name: azure-workload-identity-operator
    app.kubernetes.io/managed-by: kustomize
  name: recover-workloadidentity-sample
spec:
  # Copy namespace, name, and uid from the current WorkloadIdentity after it
  # reports Ready=False with reason RecoveryRequired.
  workloadIdentityRef:
    namespace: default
    name: workloadidentity-sample
    uid: 11111111-1111-1111-1111-111111111111
  # Copy this value from WorkloadIdentity.status.recovery.previousWorkloadIdentityUid.
  previousWorkloadIdentityUid: 22222222-2222-2222-2222-222222222222
