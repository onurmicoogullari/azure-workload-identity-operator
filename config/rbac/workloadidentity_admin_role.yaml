# This rule is not used by the project az-workload-identity-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over workloadidentity.workloadidentity.azure.micosolutions.se.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: az-workload-identity-operator
    app.kubernetes.io/managed-by: kustomize
  name: workloadidentity-admin-role
rules:
- apiGroups:
  - workloadidentity.workloadidentity.azure.micosolutions.se
  resources:
  - workloadidentities
  verbs:
  - '*'
- apiGroups:
  - workloadidentity.workloadidentity.azure.micosolutions.se
  resources:
  - workloadidentities/status
  verbs:
  - get
