# This rule is not used by the project az-workload-identity-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to workloadidentity.azure.micosolutions.se resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: az-workload-identity-operator
    app.kubernetes.io/managed-by: kustomize
  name: oidcissuer-viewer-role
rules:
- apiGroups:
  - workloadidentity.azure.micosolutions.se
  resources:
  - oidcissuers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - workloadidentity.azure.micosolutions.se
  resources:
  - oidcissuers/status
  verbs:
  - get
